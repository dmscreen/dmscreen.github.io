<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DM Screen: a free browser-based virtual screen for D&D 5e Dungeon Masters. Initiative tracker, encounter builder, generators, SRD reference, and more. All data stays in your browser.">
  <meta name="theme-color" content="#191512">
  <title>dmscreen.github.io</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z"/>
          <path d="M12 2 L12 22 M3 7 L21 17 M21 7 L3 17"/>
        </svg>
        <span class="title">DM Screen</span>
        <button class="btn icon-btn collapse-btn" id="collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 L9 12 L15 18"/></svg>
        </button>
      </div>
      <div id="campaign-bar"></div>
      <nav id="nav" aria-label="Tools"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>

  <nav id="tabbar" aria-label="Tools"></nav>
  <div id="toast-wrap" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
